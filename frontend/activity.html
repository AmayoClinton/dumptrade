<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity &mdash; Dump Trade</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/engagement.css">
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<nav class="topnav">
  <a class="brand" href="index.html"><span class="brand-mark">DT</span><span class="brand-name">Dump Trade</span></a>
  <div class="nav-links">
    <a class="nav-btn" href="index.html">Home</a>
    <a class="nav-btn active" href="browse.html">Browse</a>
    <a class="nav-btn" href="post.html">Post an item</a>
  </div>
  <div class="nav-auth">
    <a class="btn btn-outline" href="login.html">Log in</a>
    <a class="btn btn-primary" href="register.html">Register</a>
  </div>
</nav>

<main>
  <div class="section detail-section">
    <a class="back-link" href="browse.html">&larr; Back</a>
    <div id="detail-container"></div>
    <div id="detail-addons"></div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/listings.js"></script>
<script src="js/verify.js"></script>
<script src="js/support.js"></script>
<script>
  (async () => {
  const params = new URLSearchParams(window.location.search);
  const id = Number(params.get('id'));
  const container = document.getElementById('detail-container');
  const addons = document.getElementById('detail-addons');
  let item = null;

  if (typeof apiGetActivityById === 'function') {
    item = await apiGetActivityById(id);
    if (item) {
      if (typeof activityDetailHtml === 'function') container.innerHTML = activityDetailHtml(item);
      else container.innerHTML = `<div class="detail-card"><div class="detail-body"><h1 class="detail-title">${item.title || 'Activity'}</h1><p class="detail-desc">${item.description || ''}</p></div></div>`;
    }
  }
  if (!item) {
    container.innerHTML = `<div class="empty-state">Activity not found.</div>`;
  } else {
    if (typeof renderDetailAddons === 'function') renderDetailAddons(addons, item);
    if (typeof renderSupportForParent === 'function') renderSupportForParent(addons, 'activity', id);
  }
  })().catch(err => console.error("[activity] load failed:", err));
</script>
</body>
</html>
