<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register &mdash; Dump Trade</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<nav class="topnav">
  <a class="brand" href="index.html"><span class="brand-mark">DT</span><span class="brand-name">Dump Trade</span></a>
  <div class="nav-links">
    <a class="nav-btn" href="index.html">Home</a>
    <a class="nav-btn" href="browse.html">Browse</a>
    <a class="nav-btn" href="post.html">Post an item</a>
  </div>
  <div class="nav-auth">
    <a class="btn btn-outline" href="login.html">Log in</a>
    <a class="btn btn-primary" href="register.html">Register</a>
  </div>
</nav>

<main>
  <div class="section">
    <div class="section-head"><span class="section-eyebrow">REGISTER</span><h2>Create an account</h2></div>
    <form class="form-card auth-card" onsubmit="handleAuthSubmit(event)">
      <label class="field"><span>Name</span><input id="reg-name" required placeholder="Your name or organization name"></label>
      <label class="field"><span>Email</span><input id="reg-email" type="email" required placeholder="you@example.com"></label>
      <label class="field"><span>Password</span><input id="reg-password" type="password" required placeholder="********"></label>
      <label class="field"><span>Account type</span>
        <div class="toggle-row">
          <button type="button" class="toggle-btn toggle-active" id="toggle-individual" onclick="selectAccountType('individual')">Individual</button>
          <button type="button" class="toggle-btn" id="toggle-organization" onclick="selectAccountType('organization')">Organization</button>
        </div>
      </label>
      <div class="detail-actions">
        <button class="btn btn-primary" type="submit">Create account</button>
      </div>
      <p class="auth-switch">Already have an account? <a class="link-btn" href="login.html">Log in</a></p>
    </form>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/listings.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
